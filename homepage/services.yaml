# Services — https://gethomepage.dev/configs/services/
# Each card links to the public URL, shows a live status dot + CPU/RAM via the
# docker socket (server/container), and where a real integration exists, a widget.
# Icons auto-resolve from the dashboard-icons set (fetched server-side).

- Infrastructure:
    - Home Assistant:
        icon: home-assistant.png
        href: https://home.namanvashistha.com
        description: Smart-home hub & automations
        server: my-docker
        container: homeassistant
        # Reuses the HA long-lived token you already set for Glance (HA_TOKEN in
        # .env, passed through as HOMEPAGE_VAR_HASS_TOKEN). If unset, the card
        # still works — only this widget stays inactive.
        widget:
          type: homeassistant
          url: http://homeassistant:8123
          key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"

    - Glance:
        icon: glance.png
        href: https://dash.namanvashistha.com
        description: Widget dashboard (feeds, stats, docker)
        server: my-docker
        container: glance

- Applications:
    - Docmost:
        icon: docmost.png
        href: https://docs.namanvashistha.com
        description: Self-hosted wiki / docs
        server: my-docker
        container: docmost

    - eCards (demo):
        icon: mdi-card-account-details-outline
        href: https://ecards-heart-org.namanvashistha.com
        description: Static demo page (nginx)
        server: my-docker
        container: ecards

- Monitoring:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.namanvashistha.com
        description: Public-path uptime checks (auto-discovered)
        server: my-docker
        container: uptime-kuma
        # Widget needs a *published status page* in Kuma. Create one, then set
        # its slug in .env as KUMA_STATUS_SLUG and uncomment:
        # widget:
        #   type: uptimekuma
        #   url: http://uptime-kuma:3001
        #   slug: "{{HOMEPAGE_VAR_KUMA_STATUS_SLUG}}"

    - Beszel:
        icon: beszel.png
        href: https://status.namanvashistha.com
        description: Host + container metrics
        server: my-docker
        container: beszel
