# Info widgets shown in the header — https://gethomepage.dev/configs/info-widgets/
- greeting:
    text_size: xl
    text: Naman's Hub

- resources:
    label: System
    cpu: true
    memory: true
    # Container root fs. For true HOST disk usage, mount a host path in compose
    # and point this at it (Glance mounts / at /mnt/host for the same reason).
    disk: /

- search:
    provider: duckduckgo
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
