services:
  # ---- Caddy: the reverse proxy for every service on this host ----
  # Not just for this repo — chess, foodly, hyperbole and limedb attach to the
  # `caddy` network created below and are routed by the same container.
  #
  # Was ~40 lines of `docker rm -f` + `docker run` + an unquoted $extra_args
  # string in deploy.sh. That version tore the container down and recreated it
  # on EVERY deploy of ANY repo, dropping every site on the box for a few
  # seconds each time. It never needed to — Caddy watches the docker socket and
  # picks up label changes live, so `compose up -d` leaving it untouched is the
  # correct behaviour.
  #
  # Caveat worth knowing: `docker compose down` in this repo now stops the proxy
  # and darkens the other repos' sites too. deploy.sh only ever runs `up -d`, so
  # this only bites if you type `down` by hand.
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    # kept from the `docker run` era so existing docs and muscle memory still
    # find it; compose would otherwise name it dash-caddy-1
    container_name: caddy_proxy
    restart: unless-stopped
    # No `ports:` on purpose. Ingress now arrives through the cloudflared
    # tunnel below, which reaches this container as `caddy:80` over the shared
    # docker network — the host never needs a listening socket. 443 was already
    # dead weight (auto_https is off; Cloudflare terminates TLS at its edge),
    # and dropping 80 means nothing on the LAN can hit this box directly
    # either. Re-add `- "127.0.0.1:80:80"` if you want local-only access back.
    volumes:
      # read-write is required — caddy-docker-proxy needs the socket's event
      # stream to see label changes, not just a container list
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    labels:
      # Global options for caddy-docker-proxy are read from labels on its OWN
      # container. Compose form of the old
      # `--label caddy= --label caddy.auto_https=off`.
      #
      # Hardcoded rather than detected. deploy.sh used to compare `ifconfig.me`
      # against `dig` on every run to choose between "direct EC2, provision
      # Let's Encrypt" and "behind Cloudflare, HTTP only" — two network round
      # trips to re-derive a fact that hasn't changed and won't. If this box
      # ever stops sitting behind Cloudflare, delete the auto_https line rather
      # than reintroducing the guess.
      caddy: ""
      caddy.auto_https: "off"
    networks: [caddy]
    healthcheck:
      # TCP, not HTTP, and forced rather than lazy.
      #
      # An HTTP probe against :80 fails on a perfectly healthy proxy: with no
      # matching host header Caddy correctly answers 404, which wget treats as
      # an error. The obvious alternative — the admin API on :2019 — is not
      # reachable: `wget http://localhost:2019/config/` from inside this
      # container gets connection refused, because caddy-docker-proxy does not
      # serve it there despite the image EXPOSEing the port. Probing it is what
      # had this container reporting unhealthy.
      #
      # A TCP accept on :80 is the honest signal: the proxy is listening and
      # routing. Whether a given host matches is a config question, not a
      # liveness one.
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Cloudflared: the only ingress path onto this box ----
  # Replaces port-forwarding entirely. The tunnel dials OUT to Cloudflare's
  # edge, so the host needs no public IP, no open inbound port and no router
  # config — which is the whole reason this exists: the box sits behind CGNAT.
  #
  # Routing lives in the Cloudflare dashboard (Zero Trust -> Networks ->
  # Tunnels -> this tunnel -> Public Hostnames), NOT here. Point a wildcard
  # `*.namanvashistha.com` at `http://caddy:80` and every service on the box is
  # reachable the moment Caddy picks up its label — no dashboard edit per app.
  # `caddy` resolves because compose registers the service name as a network
  # alias; the container_name above is a second alias, not a replacement.
  #
  # Trade-off being accepted: Cloudflare terminates TLS, so it sees plaintext
  # for every request, and the free plan caps request bodies at 100 MB.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # --no-autoupdate because the container is the update unit; letting the
    # binary rewrite itself in place makes the running version untraceable.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      # From the dashboard when the tunnel is created. No token = no ingress
      # at all now that Caddy has no host ports, so this is not optional.
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required - see .env.example}
      - TZ=Asia/Kolkata
    expose:
      - "2000"
    networks: [caddy]
    # No healthcheck: the image is distroless-style and ships no shell, wget or
    # curl, so there is nothing to run the probe with. `--metrics` above exposes
    # /ready on :2000 instead — AutoKuma won't pick it up (no caddy label), so
    # add it in Uptime Kuma by hand as http://cloudflared:2000/ready if you
    # want the tunnel itself on the status page.

  # ---- ConOps: GitOps controller for the app stacks ----
  # Watches chess, foodly, hyperbole and limedb on GitHub, redeploys them on new
  # commits, and restarts containers it finds missing, exited or unhealthy.
  # Those four came out of deploy.sh's REPOS list when this went in.
  #
  # dash and text-to-image-bot deliberately stay in deploy.sh: ConOps clones into
  # its own runtime dir, so a stack that needs a gitignored .env (both) or a
  # repo-relative bind mount (this file's ./beszel and ./ecards) has no way to
  # find them. Adding either here would half-work, which is worse than not.
  #
  # SECURITY: ConOps ships no authentication (upstream issue #5, open) and holds
  # the docker socket, so an open dashboard is remote code execution on this box,
  # not merely an information leak. The hostname below is public; access is gated
  # by Cloudflare Access on conops.namanvashistha.com. If that policy is ever
  # removed, take this label off in the same commit.
  conops:
    # Pinned by digest, not a tag. Upstream is one contributor at v0.0.5 with no
    # release since 2026-02-17 — a floating tag on a project moving that
    # unpredictably, holding the docker socket, is not a risk worth taking.
    # This digest is v0.0.5. Bump deliberately, never automatically.
    image: anurag1201/conops@sha256:e9a2970f1c4b912807b001a99058b1bb295bcdf396df55389f1778de60135d71
    container_name: conops
    restart: unless-stopped
    environment:
      - CONOPS_RUNTIME_DIR=/opt/conops-runtime
      - TZ=Asia/Kolkata
    volumes:
      # Same path on both sides, and that is load-bearing: ConOps shells out to
      # `docker compose` against the HOST daemon, so every path it passes has to
      # resolve identically inside this container and outside it. /opt rather
      # than the upstream README's /tmp, which systemd-tmpfiles will reap.
      - /opt/conops-runtime:/opt/conops-runtime
      # SQLite lives here — no separate database container.
      - conops_data:/data
      # read-write: ConOps creates, recreates and removes containers
      - /var/run/docker.sock:/var/run/docker.sock
    # No `ports:`, deliberately. This API is unauthenticated and holds the
    # docker socket, so the fewer places it answers from the better: not the
    # host, not the LAN, only the `caddy` network. Caddy proxies it out to
    # conops.namanvashistha.com where Cloudflare Access does the gating, and
    # conops-register below reaches it from inside this same network.
    expose:
      - "8080"
    networks: [caddy]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare
      caddy: http://conops.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      # No dedicated /health endpoint upstream. The apps list is the next best
      # thing: 200 only once the server is listening AND the SQLite store
      # answers, which is exactly the readiness conops-register has to wait for.
      # wget is busybox's, from the alpine:3.19 base.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/apps/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- ConOps registration: applies conops/apps.json, then exits ----
  # ConOps has no declarative bootstrap — its app list lives only in the SQLite
  # database inside conops_data, written through the API. Lose that volume and
  # the set of deployed stacks exists nowhere in git. This one-shot makes
  # conops/apps.json the checked-in desired state and applies it on every
  # `compose up`, so the two cannot drift far.
  #
  # It runs to completion and stays Exited (0). That is the intended end state,
  # not a failure, and `restart: "no"` is what keeps it that way.
  #
  # WARNING: deploy.sh runs `docker compose ps -q | xargs docker update --restart
  # unless-stopped` over every container in this project. That will put this
  # one — designed to exit — into a permanent restart loop. Remove that line
  # from deploy.sh; every service here declares its own policy already.
  #
  # Re-run alone, without touching the rest of the stack:
  #   docker compose run --rm conops-register
  conops-register:
    # Nothing is installed into this container — register.py is standard library
    # only, precisely so the tool image can stay stock.
    image: python:3.13-alpine
    container_name: conops-register
    depends_on:
      conops:
        # not service_started: on a cold boot the container is up well before
        # the API answers, and registration against a dead API just fails
        condition: service_healthy
    volumes:
      - ./conops:/conops:ro
    environment:
      - CONOPS_URL=http://conops:8080
      - TZ=Asia/Kolkata
    command: python /conops/register.py
    restart: "no"
    networks: [caddy]

  # ---- Beszel: lightweight server + container monitoring ----
  # Hub = web UI + embedded DB. The agent below reports to it over the shared
  # unix socket in ./beszel/socket, so their traffic never crosses a network.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      # Public URL — the hub builds absolute links (and the agent install
      # snippets it shows in the UI) from this.
      - APP_URL=https://status.namanvashistha.com
      - TZ=Asia/Kolkata
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket
    # Loopback-only publish so beszel-agent (host networking, see below) can
    # reach HUB_URL for self-registration. That is the only reason it exists —
    # Caddy reaches the hub over the container network using the port in the
    # reverse_proxy label below, not through this published port and not via
    # `expose`, which is documentation rather than a mechanism.
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "8090"
    networks: [caddy]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare
      caddy: http://status.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 8090}}"
    healthcheck:
      # The hub is a PocketBase app, so /api/health is a real endpoint and
      # returns 200 without auth.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    # host networking so the agent measures the HOST's cpu/net/disk rather than
    # a container namespace. It joins no docker network — the hub talks to it
    # through the shared unix socket instead.
    network_mode: host
    volumes:
      - ./beszel/agent-data:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      # read-only docker socket → per-container stats in the hub UI
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # listen on the shared socket; add this system in the UI with
      # Host/IP = /beszel_socket/beszel.sock (port field ignored)
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://localhost:8090
      # Both come from the hub UI after first boot — set them in .env, then
      # `docker compose up -d beszel-agent`. Empty defaults keep compose from
      # erroring before you've had a chance to create them.
      - TOKEN=${BESZEL_TOKEN:-}
      - KEY=${BESZEL_KEY:-}
      - TZ=Asia/Kolkata

  # ---- Uptime Kuma + AutoKuma: uptime checks, self-discovering ----
  # Complements Beszel rather than overlapping it: Beszel watches the host,
  # Kuma watches whether each site actually answers over the public path.
  #
  # Nothing here lists endpoints. AutoKuma reads the docker socket and, via the
  # `!caddy` snippet below, turns every container that already carries a
  # `caddy:` label into a monitor — creating them as containers appear and
  # deleting them as containers go away. Spawn a new service anywhere on this
  # box with a caddy label and it is on the status page within seconds; no
  # kuma.* labels, no edits here.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - TZ=Asia/Kolkata
    expose:
      - "3001"
    networks: [caddy]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare.
      # `status.` already belongs to Beszel, so Kuma lives on `uptime.`
      caddy: http://uptime.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 3001}}"

  autokuma:
    # Two things make this exact tag necessary; `:latest` fails on both.
    #  1. `:latest` is v2.0.0, which predates the structured snippet env vars
    #     (SNIPPETS__0__KEY / __VALUE, added 2026-05-22). Without them AutoKuma
    #     rejects the config with:
    #       Invalid config: invalid type: map, expected a string for key `snippets.0`
    #     `!Snippets` themselves are old enough to be in v2.0.0 — it is only the
    #     env-var form of declaring them that is newer.
    #  2. AutoKuma 2.1 targets Uptime Kuma v2 by default. We run Kuma v1
    #     (louislam/uptime-kuma:1), so the `uptime-kuma-v1-` build is required.
    # It is a release candidate. Bump to the stable 2.1.0 tag once it exists.
    image: ghcr.io/bigboot/autokuma:uptime-kuma-v1-2.1.0-rc.2
    container_name: autokuma
    restart: unless-stopped
    depends_on:
      - uptime-kuma
    environment:
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      # Kuma has no API tokens — AutoKuma logs in as a real user. Create the
      # account on first boot at uptime.namanvashistha.com, then put it in .env.
      - AUTOKUMA__KUMA__USERNAME=${AUTOKUMA_USERNAME:-}
      - AUTOKUMA__KUMA__PASSWORD=${AUTOKUMA_PASSWORD:-}
      # A `!snippet` fires on an EXISTING label key rather than a kuma.* one,
      # receiving that label's value as args[0] — here `http://home.example.com`
      # from caddy-docker-proxy. That is what makes this zero-touch: the label
      # Caddy already needs for routing doubles as the monitor definition.
      - AUTOKUMA__SNIPPETS__0__KEY=!caddy
      - |
        AUTOKUMA__SNIPPETS__0__VALUE=
        {% set host = args[0] | replace(from="https://", to="") | replace(from="http://", to="") | trim %}
        {% if host %}
        {{ container_name }}_http.http.name: {{ container_name }}
        {{ container_name }}_http.http.url: https://{{ host }}
        {{ container_name }}_http.http.interval: 120
        {% endif %}
      - TZ=Asia/Kolkata
    volumes:
      # read-only: AutoKuma only enumerates containers and their labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - autokuma-data:/data
    networks: [caddy]

  # ---- eCards: static AHA "Claim eCard" page snapshot ----
  # Plain nginx serving the saved ./ecards folder read-only. No backend.
  # Hostname uses hyphens (ecards-heart-org) rather than a 3-deep dotted name
  # so it stays a single label under the *.namanvashistha.com Cloudflare wildcard.
  ecards:
    image: nginx:alpine
    container_name: ecards
    restart: unless-stopped
    volumes:
      - ./ecards:/usr/share/nginx/html:ro
      - ./ecards/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks: [caddy]
    labels:
      # http:// scheme required — Caddy runs auto_https=off behind Cloudflare
      caddy: http://ecards-heart-org.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 80}}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Deliberately external, and staying that way. Six independent compose
  # projects attach to this network; none of them should own it.
  #
  # Tried `name: caddy` here so compose would create it and deploy.sh could
  # drop its `docker network create`. Compose refuses to adopt a network it
  # didn't create:
  #   network caddy was found but has incorrect label
  #   com.docker.compose.network set to "" (expected: "caddy")
  # The only way to make it compose-owned is to stop every container on the box
  # and `docker network rm caddy` — a full outage to save three lines of bash.
  # External is also just the better model: no ordering constraint between
  # repos, no adoption conflicts. deploy.sh creates it.
  caddy:
    external: true

volumes:
  uptime-kuma-data:
  autokuma-data:
  # ConOps' SQLite database and its registered-app config. Losing this means
  # re-registering the four stacks, not losing the stacks themselves.
  conops_data:
  # Caddy's certificates and state, from the `docker run -v caddy_data:/data`
  # era. External for the same reason as the network above — compose applies
  # the same label check to volumes, so a `name: caddy_data` entry would fail
  # to adopt the existing one. deploy.sh creates it; external volumes are never
  # auto-created.
  caddy_data:
    external: true
